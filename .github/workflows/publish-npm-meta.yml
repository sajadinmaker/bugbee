# Republish only the tiny @neuralbroker/bugbee meta package (postinstall + optionalDeps).
name: publish-npm-meta
run-name: "npm meta ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish for @neuralbroker/bugbee"
        required: true
        type: string
        default: "1.0.1"

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'sajadinmaker/bugbee'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish meta package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          WORK=$(mktemp -d)
          cd "$WORK"
          mkdir -p meta/bin
          cp "$GITHUB_WORKSPACE/packages/bugbee/script/postinstall.mjs" meta/postinstall.mjs
          cp "$GITHUB_WORKSPACE/LICENSE" meta/LICENSE
          cat > meta/bin/bugbee.exe <<'EOS'
          #!/bin/sh
          echo "Error: bugbee postinstall did not run. Reinstall with: npm install -g @neuralbroker/bugbee" >&2
          exit 1
          EOS
          chmod 755 meta/bin/bugbee.exe

          python3 - <<'PY'
          import json, os, subprocess
          version = os.environ["VERSION"]
          candidates = [
            "bugbee-linux-x64","bugbee-linux-x64-baseline","bugbee-linux-x64-musl","bugbee-linux-x64-baseline-musl",
            "bugbee-linux-arm64","bugbee-linux-arm64-musl",
            "bugbee-darwin-x64","bugbee-darwin-x64-baseline","bugbee-darwin-arm64",
            "bugbee-windows-x64","bugbee-windows-x64-baseline","bugbee-windows-arm64",
            "@neuralbroker/bugbee-darwin-arm64","@neuralbroker/bugbee-windows-arm64",
          ]
          deps = {}
          for n in candidates:
            r = subprocess.run(["npm","view",f"{n}@1.0.0","version"], capture_output=True, text=True)
            if r.returncode == 0 and r.stdout.strip():
              # pin platform packages at 1.0.0 (release asset set)
              deps[n] = "1.0.0"
              print("include", n)
          pkg = {
            "name": "@neuralbroker/bugbee",
            "description": "Bugbee — open source AI coding agent",
            "repository": {"type": "git", "url": "https://github.com/sajadinmaker/bugbee"},
            "homepage": "https://github.com/sajadinmaker/bugbee",
            "bin": {"bugbee": "./bin/bugbee.exe"},
            "scripts": {"postinstall": "node ./postinstall.mjs"},
            "version": version,
            "license": "MIT",
            "os": ["darwin", "linux", "win32"],
            "cpu": ["arm64", "x64"],
            "optionalDependencies": deps,
          }
          open("meta/package.json","w").write(json.dumps(pkg, indent=2) + "\n")
          print("meta version", version, "optional", len(deps))
          PY

          # fix shebang file (strip accidental indent from heredoc)
          printf '%s\n' '#!/bin/sh' 'echo "Error: bugbee postinstall did not run. Reinstall with: npm install -g @neuralbroker/bugbee" >&2' 'exit 1' > meta/bin/bugbee.exe
          chmod 755 meta/bin/bugbee.exe

          cd meta
          npm pack
          npm publish ./*.tgz --access public --tag latest
          npm view @neuralbroker/bugbee version
